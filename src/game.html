
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Dodge Game</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: #080b18;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}

.game {
  width: 100%;
  max-width: 440px;
  text-align: center;
}

h1 {
  font-size: 34px;
  color: #38f8ff;
  text-shadow: 0 0 18px #00d9ff;
  margin-bottom: 8px;
}

.subtitle {
  color: #a7b2d3;
  margin-bottom: 18px;
  font-size: 14px;
}

.stats {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
}

.stat {
  flex: 1;
  padding: 12px 6px;
  background: #141a30;
  border: 1px solid #293657;
  border-radius: 12px;
  font-size: 13px;
}

.stat strong {
  display: block;
  color: #38f8ff;
  font-size: 21px;
  margin-top: 5px;
}

canvas {
  display: block;
  width: 100%;
  border: 2px solid #263a63;
  border-radius: 14px;
  background: #090e20;
  box-shadow: 0 0 25px #00d9ff20;
  touch-action: none;
}

button {
  border: none;
  border-radius: 10px;
  padding: 13px 20px;
  color: #06101b;
  background: #38f8ff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: white;
  transform: translateY(-1px);
}

#startBtn {
  width: 100%;
  margin-top: 14px;
}

.controls {
  display: flex;
  gap: 12px;
  margin-top: 12px;
}

.controls button {
  flex: 1;
  font-size: 23px;
  touch-action: none;
  user-select: none;
}

.help {
  color: #a7b2d3;
  font-size: 12px;
  margin-top: 14px;
  line-height: 1.7;
}
</style>
</head>

<body>
<div class="game">
  <h1>NEON DODGE</h1>
  <p class="subtitle">Dodge the blocks. Collect the coins. Survive!</p>

  <div class="stats">
    <div class="stat">SCORE<strong id="score">0</strong></div>
    <div class="stat">COINS<strong id="coins">0</strong></div>
    <div class="stat">BEST<strong id="best">0</strong></div>
  </div>

  <canvas id="gameCanvas" width="400" height="540"
          aria-label="Neon Dodge game area"></canvas>

  <button id="startBtn">▶ START GAME</button>

  <div class="controls">
    <button id="leftBtn" aria-label="Move left">◀</button>
    <button id="rightBtn" aria-label="Move right">▶</button>
  </div>

  <p class="help">
    Desktop: use ← → or A / D keys<br>
    Mobile: use the buttons or drag on the game<br>
    Avoid red blocks and collect golden coins!
  </p>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const scoreEl = document.getElementById("score");
  const coinsEl = document.getElementById("coins");
  const bestEl = document.getElementById("best");
  const startBtn = document.getElementById("startBtn");

  const W = canvas.width;
  const H = canvas.height;

  let best = 0;

  try {
    best = Number(localStorage.getItem("neonDodgeBest")) || 0;
  } catch (_) {}

  bestEl.textContent = best;

  let player;
  let obstacles;
  let pickups;
  let score;
  let coins;
  let elapsed;
  let spawnTimer;
  let coinTimer;
  let running = false;
  let gameOver = false;
  let lastTime = 0;
  let animationId = 0;
  let leftPressed = false;
  let rightPressed = false;
  let pointerActive = false;

  function resetGame() {
    player = {
      x: W / 2 - 16,
      y: H - 65,
      w: 32,
      h: 32,
      speed: 290
    };

    obstacles = [];
    pickups = [];
    score = 0;
    coins = 0;
    elapsed = 0;
    spawnTimer = 0;
    coinTimer = 0;
    leftPressed = false;
    rightPressed = false;

    scoreEl.textContent = "0";
    coinsEl.textContent = "0";
  }

  function startGame() {
    cancelAnimationFrame(animationId);
    resetGame();
    running = true;
    gameOver = false;
    lastTime = performance.now();
    startBtn.textContent = "↻ RESTART GAME";
    animationId = requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    gameOver = true;

    if (score > best) {
      best = score;
      bestEl.textContent = best;

      try {
        localStorage.setItem("neonDodgeBest", String(best));
      } catch (_) {}
    }

    startBtn.textContent = "↻ PLAY AGAIN";
    draw();
  }

  function spawnObstacle() {
    const size = 22 + Math.random() * 27;

    obstacles.push({
      x: Math.random() * (W - size),
      y: -size,
      w: size,
      h: size,
      speed: 155 + Math.random() * 65 + elapsed * 2.1
    });
  }

  function spawnCoin() {
    pickups.push({
      x: 15 + Math.random() * (W - 30),
      y: -20,
      r: 9,
      speed: 145 + elapsed * 1.2,
      rotation: 0
    });
  }

  function overlaps(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
  }

  function update(dt) {
    elapsed += dt;
    score += Math.floor(dt * 10);

    scoreEl.textContent = score;

    if (leftPressed) player.x -= player.speed * dt;
    if (rightPressed) player.x += player.speed * dt;

    player.x = Math.max(0, Math.min(W - player.w, player.x));

    spawnTimer += dt;
    coinTimer += dt;

    const obstacleInterval = Math.max(0.27, 0.78 - elapsed * 0.008);

    if (spawnTimer >= obstacleInterval) {
      spawnTimer = 0;
      spawnObstacle();
    }

    if (coinTimer >= 1.25) {
      coinTimer = 0;
      spawnCoin();
    }

    for (const obstacle of obstacles) {
      obstacle.y += obstacle.speed * dt;

      if (overlaps(player, obstacle)) {
        endGame();
        return;
      }
    }

    obstacles = obstacles.filter(o => o.y < H + o.h);

    for (const coin of pickups) {
      coin.y += coin.speed * dt;
      coin.rotation += dt * 5;

      const nearestX = Math.max(
        player.x, Math.min(coin.x, player.x + player.w)
      );
      const nearestY = Math.max(
        player.y, Math.min(coin.y, player.y + player.h)
      );

      const dx = coin.x - nearestX;
      const dy = coin.y - nearestY;

      if (dx * dx + dy * dy < coin.r * coin.r) {
        coin.collected = true;
        coins++;
        score += 25;
        coinsEl.textContent = coins;
        scoreEl.textContent = score;
      }
    }

    pickups = pickups.filter(c => !c.collected && c.y < H + 20);
  }

  function drawBackground() {
    ctx.fillStyle = "#090e20";
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "#182341";
    ctx.lineWidth = 1;

    for (let x = 0; x <= W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }

    for (let y = 0; y <= H; y += 40) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  }

  function drawPlayer() {
    ctx.save();
    ctx.shadowColor = "#38f8ff";
    ctx.shadowBlur = 18;
    ctx.fillStyle = "#38f8ff";
    roundedRect(player.x, player.y, player.w, player.h, 8);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff";
    roundedRect(player.x + 7, player.y + 7, 6, 6, 2);
    ctx.fill();
    roundedRect(player.x + 19, player.y + 7, 6, 6, 2);
    ctx.fill();

    ctx.fillStyle = "#087b9b";
    roundedRect(player.x + 9, player.y + 21, 14, 4, 2);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    drawBackground();

    if (!player) {
      ctx.fillStyle = "#38f8ff";
      ctx.textAlign = "center";
      ctx.font = "bold 24px Arial";
      ctx.fillText("READY PLAYER ONE?", W / 2, H / 2 - 12);
      ctx.fillStyle = "#a7b2d3";
      ctx.font = "15px Arial";
      ctx.fillText("Press START GAME to play", W / 2, H / 2 + 20);
      return;
    }

    for (const obstacle of obstacles) {
      ctx.save();
      ctx.shadowColor = "#ff4268";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "#ff355d";
      roundedRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h, 5);
      ctx.fill();
      ctx.restore();
    }

    for (const coin of pickups) {
      ctx.save();
      ctx.translate(coin.x, coin.y);
      ctx.rotate(coin.rotation);
      ctx.shadowColor = "#ffdf57";
      ctx.shadowBlur = 15;
      ctx.fillStyle = "#ffd84d";
      ctx.beginPath();
      ctx.arc(0, 0, coin.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#996600";
      ctx.font = "bold 12px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("$", 0, 1);
      ctx.restore();
    }

    drawPlayer();

    if (gameOver) {
      ctx.fillStyle = "rgba(4, 7, 19, 0.82)";
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = "#ff4268";
      ctx.font = "bold 36px Arial";
      ctx.fillText("GAME OVER", W / 2, H / 2 - 55);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 22px Arial";
      ctx.fillText("Score: " + score, W / 2, H / 2 - 10);

      ctx.fillStyle = "#ffd84d";
      ctx.font = "18px Arial";
      ctx.fillText("Coins: " + coins, W / 2, H / 2 + 25);

      ctx.fillStyle = "#a7b2d3";
      ctx.font = "15px Arial";
      ctx.fillText("Press PLAY AGAIN to retry", W / 2, H / 2 + 65);
    }
  }

  function loop(timestamp) {
    if (!running) return;

    const dt = Math.min((timestamp - lastTime) / 1000, 0.04);
    lastTime = timestamp;

    update(dt);

    if (running) {
      draw();
      animationId = requestAnimationFrame(loop);
    }
  }

  function movePointer(event) {
    if (!pointerActive || !player) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const x = (event.clientX - rect.left) * scaleX;

    player.x = Math.max(0, Math.min(W - player.w, x - player.w / 2));
  }

  canvas.addEventListener("pointerdown", event => {
    if (!running) return;
    pointerActive = true;
    canvas.setPointerCapture(event.pointerId);
    movePointer(event);
  });

  canvas.addEventListener("pointermove", movePointer);

  canvas.addEventListener("pointerup", () => {
    pointerActive = false;
  });

  canvas.addEventListener("pointercancel", () => {
    pointerActive = false;
  });

  function bindButton(id, direction) {
    const button = document.getElementById(id);

    button.addEventListener("pointerdown", event => {
      event.preventDefault();
      if (direction === "left") leftPressed = true;
      else rightPressed = true;
    });

    const release = () => {
      if (direction === "left") leftPressed = false;
      else rightPressed = false;
    };

    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
  }

  bindButton("leftBtn", "left");
  bindButton("rightBtn", "right");

  window.addEventListener("keydown", event => {
    if (["ArrowLeft", "ArrowRight", " "].includes(event.key)) {
      event.preventDefault();
    }

    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
      leftPressed = true;
    }

    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
      rightPressed = true;
    }

    if ((event.key === " " || event.key === "Enter") && !running) {
      startGame();
    }
  });

  window.addEventListener("keyup", event => {
    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
      leftPressed = false;
    }

    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
      rightPressed = false;
    }
  });

  window.addEventListener("blur", () => {
    leftPressed = false;
    rightPressed = false;
    pointerActive = false;
  });

  startBtn.addEventListener("click", startGame);

  draw();
})();
</script>
</body>
</html>
